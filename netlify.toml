[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

[build.processing.html]
  pretty_urls = true

[[redirects]]
  from = "https://paperfrogs.netlify.app/*"
  to = "https://paperfrogs.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://testpper.netlify.app/*"
  to = "https://paperfrogs.dev/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/projects"
  to = "/products/"
  status = 301

[[redirects]]
  from = "/projects/*"
  to = "/products/:splat"
  status = 301

[[redirects]]
  from = "/work"
  to = "/products/"
  status = 301

[[redirects]]
  from = "/work/*"
  to = "/products/:splat"
  status = 301

[[redirects]]
  from = "/ideas"
  to = "/studio/"
  status = 301

[[redirects]]
  from = "/ideas/*"
  to = "/studio/"
  status = 301
